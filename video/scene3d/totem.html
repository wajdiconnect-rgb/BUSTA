<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#cap{position:absolute;left:0;right:0;bottom:230px;text-align:center;font:700 64px 'Chakra Petch';letter-spacing:.08em;color:#f1e8d6;text-transform:uppercase}
#cap small{display:block;font:500 26px 'IBM Plex Mono';letter-spacing:.3em;color:#d9b267;margin-bottom:18px}
.cur{display:inline-block;width:.5em;height:.9em;background:#d9b267;vertical-align:-.08em;margin-left:.08em}
#nero{position:absolute;inset:0;background:#000;opacity:0}
#fine{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#fine img{width:820px}
#slog{margin-top:40px;font:700 58px 'Chakra Petch';letter-spacing:.1em;color:#f1e8d6}
#cta{margin-top:70px;font:600 34px 'Chakra Petch';letter-spacing:.12em;color:#d9b267;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.75))}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"><div id="vig"></div><div id="cap"></div><div id="nero"></div>
<div id="fine"><img src="logo_word.png"><div id="slog"></div><div id="cta">FREE QUOTE · LINK IN BIO</div></div></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './RoomEnvironment.js';
import {RoundedBoxGeometry} from './RoundedBoxGeometry.js';
const TW=0.724,TH=1.9,TD=0.12;
const SX0=81/1000,SX1=910/1000,SY0=1-1911/2626,SY1=1-106/2626;   // area schermo sul fronte (uv)
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1080,1920,false);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.5;
const cam=new THREE.PerspectiveCamera(32,1080/1920,0.05,100);
scene.add(new THREE.AmbientLight(0xffffff,0.06));
const key=new THREE.SpotLight(0xffffff,60,14,0.55,0.8);key.position.set(-1.5,4.5,3.5);key.target.position.set(0,-0.3,0);scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0xbfd4ff,1.8);rim.position.set(3,2,-3);scene.add(rim);
const rim2=new THREE.DirectionalLight(0xffe2b8,1.0);rim2.position.set(-3,1.5,-2);scene.add(rim2);
const tl=new THREE.TextureLoader();
const ld=(f)=>{const t=tl.load(f);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};
const texF=ld('totem_front2.jpg'),texS=ld('totem_side2.jpg');
const frutta=[1,2,3].map(k=>ld('frutta'+k+'.jpg'));
const U={time:{value:0}};
const fs=`uniform float time,on;uniform sampler2D tex;uniform vec2 off,sc;varying vec2 vUv;
void main(){vec2 g=fract(vUv*vec2(150.,330.))-.5;float d=smoothstep(.5,.2,length(g));
 vec3 base=vec3(.008,.009,.012)+vec3(.02)*d;
 vec2 uv=off+vUv*sc;float z=1.-.06*clamp(time-5.,0.,20.)/20.;uv=(uv-.5)*z+.5;
 vec3 c=texture2D(tex,uv).rgb*(.86+.2*d);
 float sh=smoothstep(.0,.05,.06-abs(vUv.x*.6+vUv.y*.4-fract(time*.09)*2.+.4))*.09;
 gl_FragColor=vec4(mix(base,c*1.1,on)+vec3(sh)*(.35+on),1.);
 #include <colorspace_fragment>
}`;
function ledMat(k){return new THREE.ShaderMaterial({uniforms:{time:U.time,on:{value:0},tex:{value:frutta[k]},off:{value:new THREE.Vector2(.38,0)},sc:{value:new THREE.Vector2(.236,1)}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:fs,toneMapped:false});}
const matF=new THREE.MeshStandardMaterial({map:texF,metalness:.5,roughness:.42});
const matS=new THREE.MeshStandardMaterial({map:texS,metalness:.6,roughness:.4});
const matT=new THREE.MeshStandardMaterial({color:0x2a2c30,metalness:.7,roughness:.35});
const ombraT=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const gr=x.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,'rgba(0,0,0,0.85)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);})();
const ombra=new THREE.MeshBasicMaterial({map:ombraT,transparent:true,depthWrite:false});
const vetro=new THREE.MeshPhysicalMaterial({color:0x000000,metalness:0,roughness:.05,transparent:true,opacity:.18,clearcoat:1,clearcoatRoughness:.04});
function totem(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new RoundedBoxGeometry(TW,TH,TD,4,0.014),matT);g.add(body);
 for(const s of [1,-1]){const f=new THREE.Mesh(new THREE.PlaneGeometry(TW-0.02,TH-0.02),matF);f.position.z=s*(TD/2+0.0008);if(s<0)f.rotation.y=Math.PI;g.add(f);}
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(TW*1.5,TD*7),ombra);sh.rotation.x=-Math.PI/2;sh.position.y=-TH/2+0.003;g.add(sh);
 const scr=[];
 for(const s of [1,-1]){
  const w=(SX1-SX0)*TW,h=(SY1-SY0)*TH,cx=((SX0+SX1)/2-.5)*TW,cy=((SY0+SY1)/2-.5)*TH;
  const m=ledMat(s>0?1:2);const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);p.position.set(cx*s,cy,s*(TD/2+.002));if(s<0)p.rotation.y=Math.PI;g.add(p);scr.push(m);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),vetro);gl.position.set(cx*s,cy,s*(TD/2+.004));if(s<0)gl.rotation.y=Math.PI;g.add(gl);
 }
 g.userData.scr=scr;g.visible=false;scene.add(g);return g;
}
const T=[totem(),totem(),totem()];
// pavimento lucido
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x020203,metalness:.2,roughness:.55,envMapIntensity:0.0}));
floor.rotation.x=-Math.PI/2;floor.position.y=-TH/2;scene.add(floor);scene.fog=new THREE.Fog(0x000000,5,13);
const cl=x=>Math.min(1,Math.max(0,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function look(p,t){cam.position.copy(p);cam.lookAt(t);}
const capEl=document.getElementById('cap');
function caption(t,a,b,small,txt){if(t<a||t>b)return false;const k=Math.floor((t-a)*22);const s=txt.slice(0,Math.min(txt.length,k));
 capEl.style.opacity=t>b-.45?cl((b-t)/.45):1;capEl.innerHTML=(small?`<small>${small}</small>`:'')+s+((Math.floor(t*2.4)%2==0||k<txt.length)?'<span class="cur"></span>':'');return true;}
const nero=document.getElementById('nero'),fine=document.getElementById('fine'),slog=document.getElementById('slog'),cta=document.getElementById('cta');
const cuts=[5,10,15];
window.render=function(t){
 T.forEach(x=>{x.visible=false;x.userData.scr.forEach(m=>m.uniforms.on.value=0);});U.time.value=t;
 const t0=T[0];
 if(t<5){ // 1 · il totem sottile che gira nel buio
  t0.visible=true;t0.position.set(0,0,0);t0.rotation.y=lerp(-1.45,-0.35,ez(seg(t,0,5)));
  look(V(0.3,lerp(-0.1,0.35,seg(t,0,5)),lerp(5.6,4.9,seg(t,0,5))),V(0,0.0,0));
 }else if(t<10){ // 2 · lo schermo si accende, avvicinamento ai pixel
  t0.visible=true;t0.position.set(0,0,0);t0.rotation.y=lerp(-0.25,0.05,seg(t,5,10));
  t0.userData.scr[0].uniforms.on.value=ez(seg(t,5.6,6.6));
  const k=ez(seg(t,6.4,10));look(V(lerp(0.3,0.05,k),lerp(0.3,0.4,k),lerp(4.9,1.5,k)),V(0,lerp(0.0,0.32,k),0));
 }else if(t<15){ // 3 · fronte e retro: gira e mostra il secondo schermo
  t0.visible=true;t0.position.set(0,0,0);t0.rotation.y=lerp(0.2,Math.PI-0.25,ez(seg(t,10.3,13.6)));
  t0.userData.scr[0].uniforms.on.value=1;t0.userData.scr[1].uniforms.on.value=ez(seg(t,11.0,11.8));
  look(V(0.8,0.3,4.9),V(0,0.0,0));
 }else if(t<21){ // 4 · fila di totem in una via di negozi
  T.forEach((x,i)=>{x.visible=true;x.position.set(-i*2.1,0,-i*2.0);x.rotation.y=0.42;
   x.userData.scr.forEach((m,j)=>{m.uniforms.tex.value=frutta[(i+j)%3];m.uniforms.on.value=ez(seg(t,15.2+i*0.35,15.9+i*0.35));});});
  const k=ez(seg(t,15,21));look(V(lerp(3.0,2.2,k),lerp(0.3,0.5,k),lerp(6.2,5.5,k)),V(lerp(-1.2,-1.9,k),0.0,lerp(-1.4,-2.2,k)));
 }else{look(V(0,0,5),V(0,0,0));}
 renderer.render(scene,cam);
 let c=caption(t,0.6,4.7,'Ledinfinity','Infinity Totem')||caption(t,6.6,9.7,'','Bright in full sun')||caption(t,11.6,14.7,'','Front and back')||caption(t,16.4,20.7,'','For every storefront');
 if(!c)capEl.innerHTML='';
 let b=0;for(const x of cuts)b=Math.max(b,1-Math.abs(t-x)/0.16);
 const f=ez(seg(t,21.2,22.2));fine.style.opacity=f;nero.style.opacity=Math.max(cl(b),f);
 const sl='THE FUTURE IS NOW.';const k=Math.floor(seg(t,22.4,23.6)*sl.length);
 slog.innerHTML=t>22.3?sl.slice(0,k)+((Math.floor(t*2.4)%2==0||k<sl.length)?'<span class="cur"></span>':''):'';
 cta.style.opacity=ez(seg(t,23.8,24.4));
 return true;};
window.pronto=new Promise(r=>{const c=()=>{if([texF,texS,...frutta].every(x=>x.image&&x.image.complete))document.fonts.ready.then(()=>r(true));else setTimeout(c,100)};c();});
</script></body></html>
