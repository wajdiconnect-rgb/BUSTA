<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#cap{position:absolute;left:0;right:0;bottom:230px;text-align:center;font:700 64px 'Chakra Petch';letter-spacing:.08em;color:#f1e8d6;text-transform:uppercase}
#cap small{display:block;font:500 26px 'IBM Plex Mono';letter-spacing:.3em;color:#d9b267;margin-bottom:18px}
.cur{display:inline-block;width:.5em;height:.9em;background:#d9b267;vertical-align:-.08em;margin-left:.08em}
#nero{position:absolute;inset:0;background:#000;opacity:0}
#fine{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#fine img{width:820px}
#slog{margin-top:40px;font:700 58px 'Chakra Petch';letter-spacing:.1em;color:#f1e8d6}
#vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.75))}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"><div id="vig"></div><div id="cap"></div><div id="nero"></div>
<div id="fine"><img src="logo_word.png"><div id="slog"></div></div></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from './RoomEnvironment.js';

const W=0.5,H=0.505,D=0.085;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1080,1920,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
const cam=new THREE.PerspectiveCamera(32,1080/1920,0.05,100);

scene.add(new THREE.AmbientLight(0xffffff,0.08));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(-2,1.2,-4); scene.add(key);
const rim=new THREE.DirectionalLight(0xbfd4ff,1.6); rim.position.set(3,2,3); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(2,-1,-3); scene.add(fill);

const tl=new THREE.TextureLoader();
const retro=tl.load('retro_m.png'); retro.colorSpace=THREE.SRGBColorSpace; retro.anisotropy=8;
const bump=tl.load('retro_m.png');
const matBack=new THREE.MeshStandardMaterial({map:retro,alphaTest:0.5,metalness:0.55,roughness:0.42,bumpMap:bump,bumpScale:1.2});
function latoTex(f,fx,fy){const t=tl.load(f);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(fx){t.repeat.x=-1;t.offset.x=1;}if(fy){t.repeat.y=-1;t.offset.y=1;}return t;}
const lm=t=>new THREE.MeshStandardMaterial({map:t,alphaTest:0.5,side:THREE.DoubleSide,metalness:0.75,roughness:0.32,envMapIntensity:1.2});
const hid=new THREE.MeshBasicMaterial({visible:false});
const matSide=[lm(latoTex('lato_v.png',0,0)),lm(latoTex('lato_v.png',1,0)),lm(latoTex('lato_h.png',0,1)),lm(latoTex('lato_h.png',0,0)),hid,hid];
const matIn=new THREE.MeshStandardMaterial({color:0x101114,metalness:0.3,roughness:0.8});
const U={time:{value:0},on:{value:0}};
const frutta=[1,2,3].map(k=>{const t=tl.load('frutta'+k+'.jpg');t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;});
const vs=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fs=`uniform float time,on;uniform sampler2D tex;uniform vec2 off,sc;varying vec2 vUv;
void main(){
 vec2 g=fract(vUv*vec2(64.,64.))-.5; float d=smoothstep(.5,.2,length(g));
 vec2 m=abs(fract(vUv*2.)-.5); float seam=smoothstep(.497,.5,max(m.x,m.y));
 vec2 e=min(vUv,1.-vUv); float edge=smoothstep(.0,.008,min(e.x,e.y));
 vec3 base=vec3(.004,.004,.005)+vec3(.012)*d; base*=(1.-seam*.8); base*=edge;
 vec2 uv=off+vUv*sc; float z=1.-.05*clamp(time-12.,0.,20.)/20.; uv=(uv-.5)*z+.5;
 vec3 c=texture2D(tex,uv).rgb;
 vec3 lit=c*(.78+.32*d);
 gl_FragColor=vec4(mix(base,lit*1.08,on),1.);
 #include <colorspace_fragment>
}`;
function ledMat(){return new THREE.ShaderMaterial({uniforms:{time:U.time,on:U.on,tex:{value:frutta[0]},off:{value:new THREE.Vector2(0,0)},sc:{value:new THREE.Vector2(1,1)}},vertexShader:vs,fragmentShader:fs,toneMapped:false});}
function cab(){
 const g=new THREE.Group();
 const back=new THREE.Mesh(new THREE.PlaneGeometry(W,H),matBack); back.rotation.y=Math.PI; back.position.z=-D/2; g.add(back);
 const body=new THREE.Mesh(new THREE.BoxGeometry(W*0.985,H*0.97,D*0.96),matSide); g.add(body);
 const in1=new THREE.Mesh(new THREE.PlaneGeometry(W*0.97,H*0.95),matIn); in1.position.z=D/2-0.004; in1.rotation.y=Math.PI; g.add(in1);
 const in2=new THREE.Mesh(new THREE.PlaneGeometry(W*0.97,H*0.95),matIn); in2.position.z=-D/2+0.004; g.add(in2);
 const led=new THREE.Mesh(new THREE.PlaneGeometry(W,H),ledMat()); led.position.z=D/2+0.002; g.add(led); g.userData.led=led;
 g.visible=false; scene.add(g); return g;
}
const pool=[];for(let i=0;i<40;i++)pool.push(cab());
// immagine sullo schermo: k = foto, (ox,oy) inizio, (sx,sy) porzione
function img(c,k,ox,oy,sx,sy){const u=c.userData.led.material.uniforms;u.tex.value=frutta[k];u.off.value.set(ox,oy);u.sc.value.set(sx,sy);}

const cl=x=>Math.min(1,Math.max(0,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function look(p,tg){cam.position.copy(p);cam.lookAt(tg);}
function orbit(r,ang,y,tg){look(V(tg.x+Math.sin(ang)*r,y,tg.z+Math.cos(ang)*r),tg);}
function place(c,x,y,z,ry,rx=0){c.visible=true;c.position.set(x,y,z);c.rotation.set(rx,ry,0,'YXZ');}

// tecno caption
const capEl=document.getElementById('cap');
function caption(t,a,b,small,txt){
 if(t<a||t>b)return false;
 const k=Math.floor((t-a)*22); const s=txt.slice(0,Math.min(txt.length,k));
 const out=t>b-0.45?cl((b-t)/0.45):1;
 capEl.style.opacity=out;
 capEl.innerHTML=(small?`<small>${small}</small>`:'')+s+((Math.floor(t*2.4)%2==0||k<txt.length)?'<span class="cur"></span>':'');
 return true;
}
const nero=document.getElementById('nero'),fine=document.getElementById('fine'),slog=document.getElementById('slog');
const cuts=[5,10,15,21.5,27];

window.render=function(t){
 pool.forEach(c=>c.visible=false); U.time.value=t; U.on.value=0;
 let tg;
 if(t<5){ // 1 · un cabinet che gira
  const c=pool[0]; place(c,0,0,0,lerp(0.75,-0.55,ez(seg(t,0,5))));
  look(V(0.05,0.08,lerp(-1.95,-1.45,ez(seg(t,0,5)))),V(0,0,0));
 } else if(t<10){ // 2 · angolo a 90°
  const k=ez(seg(t,5.3,7.6));
  place(pool[0],0,0,0,0);
  place(pool[1],lerp(1.3,W/2+D/2,k),lerp(0.35,0,k),lerp(-0.9,-W/2+D/2,k),lerp(Math.PI/2+1.4,Math.PI/2,k));
  const a=lerp(0.25,0.85,ez(seg(t,5,10)));
  tg=V(0.02,0,-0.2); orbit(2.6,Math.PI+a,0.45,tg);
 } else if(t<15){ // 3 · cubo che si accende
  const k=ez(seg(t,10.2,12.2)),s=W/2-D/2,e=lerp(0.65,0,k);
  place(pool[0],0,0,s+e,0); place(pool[1],s+e,0,0,Math.PI/2);
  place(pool[2],0,0,-s-e,Math.PI); place(pool[3],-s-e,0,0,-Math.PI/2);
  place(pool[4],0,H/2-D/2+e*1.2,0,0,-Math.PI/2);
  for(let q=0;q<5;q++)img(pool[q],q%3,0.25,0,0.5,1);
  U.on.value=ez(seg(t,12.4,13.2));
  tg=V(0,0,0); orbit(2.3,lerp(0.5,2.1,ez(seg(t,10,15))),0.95,tg);
 } else if(t<21.5){ // 4 · parete che si curva
  const cols=4,rows=3,R0=0.85; const bend=ez(seg(t,16.6,18.6)); const c=bend/R0;
  let i=0;
  for(let r=0;r<rows;r++)for(let j=0;j<cols;j++){
   const s=(j-(cols-1)/2)*W; const inK=ez(seg(t,15+j*0.12+r*0.06,15.9+j*0.12+r*0.06));
   let x=s,z=0,ry=0; if(c>1e-4){const th=s*c;x=Math.sin(th)/c;z=(1-Math.cos(th))/c;ry=-th;}
   img(pool[i],1,0.167+j*0.667/cols,r/rows,0.667/cols,1/rows);
   place(pool[i++],x,(r-1)*H,z-(1-inK)*2.2,ry);
  }
  U.on.value=ez(seg(t,19.4,20.2));
  tg=V(0,0,0.35); const a=lerp(Math.PI*1.0,Math.PI*0.06,ez(seg(t,18.4,21.3)));
  orbit(lerp(7.6,6.3,seg(t,15,21.5)),a,0.9,tg);
 } else if(t<27){ // 5 · anello quadrato che scende e si accende
  const n=4,L=n*W; let i=0;
  for(let side=0;side<4;side++)for(let r=0;r<2;r++)for(let j=0;j<n;j++){
   const s=(j-(n-1)/2)*W, d=L/2-D/2, ang=side*Math.PI/2;
   const x=Math.sin(ang)*d+Math.cos(ang)*s, z=Math.cos(ang)*d-Math.sin(ang)*s;
   const o=side*n+j+r*0.5; const k=ez(seg(t,21.6+o*0.08,22.6+o*0.08));
   img(pool[i],side%3,j/n,r/2,1/n,1/2);
   const out=(1-k)*2.6; place(pool[i++],x+Math.sin(ang)*out,(r-0.5)*H,z+Math.cos(ang)*out,ang+(1-k)*0.6);
  }
  U.on.value=ez(seg(t,23.9,24.8));
  tg=V(0,-0.1,0); orbit(6.2,lerp(0.3,1.25,ez(seg(t,21.5,27))),lerp(4.4,3.2,seg(t,21.5,27)),tg);
 } else { look(V(0,0,-3),V(0,0,0)); }
 renderer.render(scene,cam);
 // overlay
 let caps=caption(t,0.6,4.7,'Ledinfinity','Infinity Stage')||caption(t,7.6,9.7,'','Angoli a 90°')||caption(t,12.6,14.7,'','Ogni forma')||caption(t,18.6,21.2,'','Pareti curve')||caption(t,24.4,26.7,'','Senza limiti');
 if(!caps)capEl.innerHTML='';
 let b=0; for(const c of cuts){b=Math.max(b,1-Math.abs(t-c)/0.28);} nero.style.opacity=cl(b);
 const f=ez(seg(t,27.2,28.2)); fine.style.opacity=f; nero.style.opacity=Math.max(cl(b),f);
 const sl='THE FUTURE IS NOW.'; const k=Math.floor(seg(t,28.4,29.6)*sl.length);
 slog.innerHTML=t>28.3?sl.slice(0,k)+((Math.floor(t*2.4)%2==0||k<sl.length)?'<span class="cur"></span>':''):'';
 return true;
};
window.pronto=new Promise(r=>{const c=()=>{if(retro.image&&retro.image.complete&&bump.image&&bump.image.complete&&frutta.every(f=>f.image&&f.image.complete))document.fonts.ready.then(()=>r(true));else setTimeout(c,100)};c();});
</script></body></html>
