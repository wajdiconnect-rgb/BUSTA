<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Busta</title>
<style>
body{margin:0;font-family:sans-serif;background:#f2f4f3;color:#1d2b24}
header{background:#14532d;color:#fff;padding:22px}
h1{margin:0;font-size:26px}
.chi button{font-size:16px;padding:8px 18px;border-radius:8px;border:1px solid #fff;background:none;color:#fff;margin:10px 8px 0 0}
.chi .on{background:#fff;color:#14532d}
.b{background:#fff;border-radius:12px;padding:16px;margin:12px 16px}
.r{font-size:26px;font-weight:600}
.barra{height:8px;background:#e3e8e5;border-radius:4px;margin-top:8px}
.p{height:8px;background:#15803d;border-radius:4px}
#m{text-align:center;font-size:17px;padding:0 16px}
.bt{display:block;width:calc(100% - 32px);margin:10px 16px;font-size:20px;padding:16px;border:none;border-radius:12px;background:#14532d;color:#fff}
</style></head><body>
<header><h1>BUSTA</h1><div id="ciao"></div>
<div class="chi"><button id="bW" onclick="chi('Wajdi')">Wajdi</button><button id="bR" onclick="chi('Rosy')">Rosy</button></div></header>
<div id="g"></div>
<p id="m"></p>
<button class="bt" onclick="ascolta()">Parla</button>
<button class="bt" onclick="scrivi()">Scrivi spesa</button>
<button class="bt" onclick="resta()">Quanto resta?</button>
<button class="bt" onclick="nuovo()">Nuovo mese</button>
<script>
const B={spesa:['Spesa',600],benzina:['Benzina',300],bambini:['Bambini',80],imprevisti:['Imprevisti',40]};
let d=JSON.parse(localStorage.busta2||'{"n":"Wajdi","s":{}}');
speechSynthesis.getVoices();
function sv(){localStorage.busta2=JSON.stringify(d)}
function di(t){document.getElementById('m').textContent=t;let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';
let v=speechSynthesis.getVoices().find(x=>x.name.includes('Federica'));if(v)u.voice=v;
speechSynthesis.cancel();speechSynthesis.speak(u)}
function rs(k){return B[k][1]-(d.s[k]||0)}
function mostra(){document.getElementById('ciao').textContent='Ciao '+d.n;
document.getElementById('bW').className=d.n=='Wajdi'?'on':'';
document.getElementById('bR').className=d.n=='Rosy'?'on':'';
let h='';for(let k in B){let r=rs(k),p=Math.max(0,Math.min(100,r/B[k][1]*100));
h+='<div class="b">'+B[k][0]+' (su '+B[k][1]+' €)<div class="r">'+r+' €</div><div class="barra"><div class="p" style="width:'+p+'%"></div></div></div>'}
document.getElementById('g').innerHTML=h}
function chi(n){d.n=n;sv();mostra();di('Ciao '+n)}
function capisci(t){t=t.toLowerCase();let x=t.match(/\d+([.,]\d+)?/);let e=x?parseFloat(x[0].replace(',','.')):0;
for(let k in B)if(t.includes(k.slice(0,5))&&e){d.s[k]=(d.s[k]||0)+e;sv();mostra();di('Ok, nella busta '+B[k][0]+' restano '+rs(k)+' euro');return}
di('Non ho capito. Per esempio: spesa 40')}
function scrivi(){let t=prompt('Scrivi, per esempio: spesa 40');if(t)capisci(t)}
function ascolta(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){scrivi();return}
let r=new S();r.lang='it-IT';r.onresult=e=>capisci(e.results[0][0].transcript);r.onerror=()=>scrivi();r.start();di('Ti ascolto')}
function resta(){let t='';for(let k in B)t+=B[k][0]+' '+rs(k)+' euro. ';di(t)}
function nuovo(){if(confirm('Ricominciare il mese?')){d.s={};sv();mostra();di('Nuovo mese, buste piene')}}
mostra();
</script></body></html>
